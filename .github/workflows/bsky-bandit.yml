name: bsky-source-bandit

on:
  schedule:
    # 08,11,14,17,20,23 JST: measure due posts, then post once.
    - cron: '0 23,2,5,8,11,14 * * *'
    # 09:30 JST every Monday: weekly report.
    - cron: '30 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print would-be posts without posting or recording'
        type: boolean
        default: true
      report:
        description: 'Also generate the weekly report'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bsky-bandit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test
        working-directory: bandit
        run: npm test

      - name: Measure
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        working-directory: bandit
        run: node src/run-measure.mjs

      - name: Post
        working-directory: bandit
        run: node src/run-post.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Weekly report
        if: github.event.schedule == '30 0 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.report)
        working-directory: bandit
        run: node src/run-report.mjs 7 >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        run: |
          git config user.name 'bsky-bandit[bot]'
          git config user.email 'bsky-bandit@users.noreply.github.com'
          git add data/bsky
          if git diff --cached --quiet; then
            echo 'no data changes'
          else
            git commit -m "bsky-bandit: $(date +%F) run"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
